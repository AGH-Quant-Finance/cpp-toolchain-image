name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Release Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Image: ghcr.io/$IMAGE_NAME"

      - name: Determine version
        id: version
        shell: bash
        run: |
          EXISTING_TAG="$(
            git tag \
              --points-at HEAD \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
              --sort=-v:refname \
              | head -n 1
          )"

          if [[ -n "$EXISTING_TAG" ]]; then
            VERSION="${EXISTING_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            echo "Current commit already has release tag: $EXISTING_TAG"
            echo "Reusing version: $VERSION"
          else
            COMMIT_MESSAGE="$(git log -1 --pretty=%s)"

            echo "Commit message: $COMMIT_MESSAGE"

            if [[ "$COMMIT_MESSAGE" =~ ^\[MAJOR\] ]]; then
              BUMP="major"
            elif [[ "$COMMIT_MESSAGE" =~ ^\[MINOR\] ]]; then
              BUMP="minor"
            elif [[ "$COMMIT_MESSAGE" =~ ^\[PATCH\] ]]; then
              BUMP="patch"
            else
              echo "Commit message must start with [MAJOR], [MINOR] or [PATCH]"
              exit 1
            fi

            LATEST_TAG="$(
              git tag \
                --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-v:refname \
                | head -n 1
            )"

            if [[ -z "$LATEST_TAG" ]]; then
              CURRENT_VERSION="0.0.0"
            else
              CURRENT_VERSION="${LATEST_TAG#v}"
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case "$BUMP" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            echo "Current version: $CURRENT_VERSION"
            echo "Bump:            $BUMP"
            echo "New version:     $VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.major }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
